version: 0.2

phases:

  pre_build:
    commands:
      - echo "Logging in to ECR..."

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=$AWS_DEFAULT_REGION
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/brain-tasks-app

      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI

      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION

  build:
    commands:
      - echo "Building Docker image..."
      - docker build --platform linux/amd64 -t $ECR_URI:$IMAGE_TAG .

      - echo "Pushing Docker image..."
      - docker push $ECR_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Updating Kubernetes deployment..."

      - aws eks update-kubeconfig --region $AWS_REGION --name brain-tasks-cluster

      - kubectl set image deployment/brain-tasks-app brain-tasks-app=$ECR_URI:$IMAGE_TAG

      - kubectl rollout status deployment/brain-tasks-app

      - echo "Deployment successful."

